name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Forks have no signing secrets: they still build, just unsigned, and skip the release.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dodo-stt.p12"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/dodo-stt.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish release
        if: env.SIGNING_STORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk dodo-stt.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dodo-stt.apk --title "Dodo STT $TAG" --notes "Automated build of ${{ github.sha }}" --latest
