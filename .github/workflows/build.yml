name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Forks have no signing secrets: they still build, just unsigned, and skip both releases.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dodo-stt.p12"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/dodo-stt.p12" >> "$GITHUB_ENV"
          fi

      # The GitHub APK, which updates itself, and the Play bundle, which Google Play updates. The
      # same key signs both: for Play it is the upload key, and Play re-signs with its own.
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleGithubRelease :app:bundlePlayRelease --no-daemon --stacktrace

      - name: Keep the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: doodoo-play-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab

      # Only main publishes: installed copies of the GitHub build update themselves from the latest
      # release, so a test run on a branch must never create one. The asset keeps its old name
      # because that is the file older installs look for.
      - name: Publish GitHub release
        if: env.SIGNING_STORE_FILE != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk dodo-stt.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dodo-stt.apk --title "Doodoo $TAG" --notes "Automated build of ${{ github.sha }}" --latest

      # Needs PLAY_SERVICE_ACCOUNT_JSON. Play accepts only drafts until the app's first release has
      # been rolled out by hand in the Console; after that, set the repository variable
      # PLAY_RELEASE_STATUS to "completed" and every push goes straight to internal testers.
      - name: Check for Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_JSON" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Upload to Play internal testing
        if: steps.play.outputs.ready == 'yes' && env.SIGNING_STORE_FILE != '' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zaynikhlaq.dodostt
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          releaseName: 1.0.${{ github.run_number }}
          tracks: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
